<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Playlist POC</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #eceff1;
      color: #1b1f23;
    }
    .layout {
      max-width: 960px;
      margin: 2em auto 3em;
      padding: 0 1.5em;
      display: grid;
      gap: 1.5em;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
      padding: 1.5em;
      display: flex;
      flex-direction: column;
      gap: 0.75em;
    }
    h2, h3 {
      margin: 0;
      font-weight: 700;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      font-weight: 600;
      color: #37474f;
    }
    .field input {
      font-weight: 500;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      padding: 0.45em 0.6em;
      font-size: 0.95em;
      color: #1b1f23;
    }
    .field.compact {
      max-width: 280px;
    }
    .inline-actions {
      display: flex;
      align-items: center;
      gap: 0.75em;
      flex-wrap: wrap;
    }
    button {
      border-radius: 6px;
      border: 1px solid #607d8b;
      background: #fff;
      color: #37474f;
      padding: 0.45em 0.9em;
      font-size: 0.95em;
      cursor: pointer;
    }
    button.primary {
      background: #1976d2;
      border-color: #1976d2;
      color: #fff;
      font-weight: 600;
    }
    button:hover {
      filter: brightness(0.95);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1em;
    }
    .section-tools {
      display: flex;
      gap: 0.5em;
      align-items: center;
    }
    .helper-text {
      font-size: 0.9em;
      color: #546e7a;
      margin: 0;
    }
    .playlist {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 2px dashed #b0bec5;
      border-radius: 10px;
      min-height: 160px;
      background: #f7f9fa;
      transition: border-color 0.2s, background 0.2s;
    }
    .playlist.dragover {
      background: #e3f2fd;
      border-color: #64b5f6;
    }
    .playlist li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75em;
      padding: 0.65em 0.85em;
      border-bottom: 1px solid #e0e6eb;
      background: #fff;
      cursor: grab;
      user-select: none;
    }
    .playlist li:last-child {
      border-bottom: none;
    }
    .playlist li.dragging {
      opacity: 0.6;
      background: #eceff1;
    }
    .playlist li.over {
      border-top: 2px solid #1e88e5;
    }
    .entry-label {
      font-weight: 600;
      color: #263238;
      word-break: break-word;
      flex: 1;
    }
    .entry-meta {
      min-width: 200px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25em;
      font-size: 0.85em;
      color: #455a64;
    }
    .entry-length {
      font-weight: 600;
    }
    .times {
      font-size: 0.85em;
      color: #546e7a;
    }
    .schedule-row {
      display: flex;
      gap: 0.75em;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .status-log {
      min-height: 2.5em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9em;
      color: #37474f;
      white-space: pre-wrap;
    }
    #connStatus {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="card">
      <h2>OBS Playlist POC</h2>
      <label class="field">OBS WebSocket URL:
        <input type="text" id="wsUrl" value="ws://the-microplex:4455">
      </label>
      <div class="inline-actions">
        <button id="connectBtn">Connect</button>
        <span id="connStatus">Not connected</span>
      </div>
      <label class="field">Media Source Name:
        <input type="text" id="mediaSource" value="MyMedia">
      </label>
    </section>

    <section class="card">
      <header class="section-header">
        <h3>Playlist</h3>
        <div class="section-tools">
          <button id="addFileBtn" class="primary">Add Files…</button>
          <input type="file" id="fileInput" multiple hidden>
        </div>
      </header>
      <p class="helper-text">Drop Finder files anywhere in this list or use Add Files to build the playlist. Drag to reorder, double-click to remove.</p>
      <ul id="playlistList" class="playlist"></ul>
      <div class="inline-actions">
        <button id="playBtn">Play</button>
        <button id="streamBtn">Start Streaming</button>
      </div>
    </section>

    <section class="card">
      <h3>Schedule</h3>
      <div class="schedule-row">
        <label class="field compact">Start time
          <input type="datetime-local" id="scheduleTime">
        </label>
        <button id="scheduleBtn">Schedule Start</button>
      </div>
    </section>

    <section class="card">
      <h3>Status</h3>
      <div id="status" class="status-log"></div>
    </section>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const wsUrlInput = document.getElementById('wsUrl');
      const mediaSourceInput = document.getElementById('mediaSource');
      const playlistList = document.getElementById('playlistList');
      const addFileBtn = document.getElementById('addFileBtn');
      const fileInput = document.getElementById('fileInput');
      const connectBtn = document.getElementById('connectBtn');
      const playBtn = document.getElementById('playBtn');
      const streamBtn = document.getElementById('streamBtn');
      const scheduleBtn = document.getElementById('scheduleBtn');
      const scheduleInput = document.getElementById('scheduleTime');
      const statusEl = document.getElementById('status');
      const connStatusEl = document.getElementById('connStatus');

      if (!wsUrlInput || !mediaSourceInput || !playlistList || !addFileBtn || !fileInput || !connectBtn || !playBtn || !streamBtn || !scheduleBtn || !scheduleInput || !statusEl || !connStatusEl) {
        console.error('Playlist UI failed to initialize: missing required elements');
        return;
      }

      let ws = null;
      let playlist = [];
      let currentIndex = 0;
      let playing = false;
      let mediaSource = mediaSourceInput.value.trim();
      let requestCounter = 1;
      let poller = null;
      let scheduleTimeout = null;

      function cleanPath(path) {
        return path.replace(/^[\\"']+|[\\"']+$/g, '').trim();
      }

      function formatTime(seconds) {
        if (seconds == null || isNaN(seconds)) return '--:--';
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        return (h > 0 ? h + ':' : '') + (m < 10 && h > 0 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      }

      function getPlaylist() {
        return Array.from(playlistList.querySelectorAll('li')).map(li => cleanPath(li.dataset.path));
      }

      function getPlaylistData() {
        return Array.from(playlistList.querySelectorAll('li')).map(li => ({
          path: li.dataset.path,
          duration: Number(li.dataset.duration ?? 0)
        }));
      }

      function getMediaSource() {
        return mediaSourceInput.value.trim();
      }

      function normalizeDuration(value) {
        if (value === undefined || value === null) return null;
        const numeric = typeof value === 'number' ? value : Number(value);
        return Number.isFinite(numeric) ? numeric : null;
      }

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function setConnStatus(msg, color = 'black') {
        connStatusEl.textContent = msg;
        connStatusEl.style.color = color;
      }

      function updateStartEndTimes() {
        const now = new Date();
        let acc = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        playlistList.querySelectorAll('li').forEach(li => {
          const dur = parseFloat(li.dataset.duration) || 0;
          const start = acc;
          const end = acc + dur;
          const timesSpan = li.querySelector('.times');
          if (timesSpan) {
            timesSpan.textContent = `Start: ${formatTime(start)}  End: ${formatTime(end)}`;
          }
          acc = end;
        });
      }

      async function saveSettings() {
        if (!window.mediaTools) return;
        try {
          await Promise.all([
            window.mediaTools.saveData('wsUrl', wsUrlInput.value),
            window.mediaTools.saveData('mediaSource', mediaSourceInput.value),
            window.mediaTools.saveData('playlist', getPlaylistData()),
            window.mediaTools.saveData('scheduleTime', scheduleInput.value)
          ]);
        } catch (err) {
          console.warn('saveSettings failed', err);
        }
      }

      async function addToPlaylist(paths, durationOverride, options = {}) {
        if (!Array.isArray(paths) || !paths.length) {
          return;
        }

        const hasDurationHelper = window.mediaTools && typeof window.mediaTools.getDuration === 'function';
        const pendingUpdates = [];
        for (const path of paths) {
          const cleaned = cleanPath(path);
          if (!cleaned) continue;

          const displayName = cleaned.split(/[\\/]/).pop() || cleaned;
          const li = document.createElement('li');
          li.dataset.path = cleaned;
          li.draggable = true;

          attachDragHandlers(li);

          const label = document.createElement('span');
          label.className = 'entry-label';
          label.textContent = displayName;

          const meta = document.createElement('div');
          meta.className = 'entry-meta';

          const lengthSpan = document.createElement('span');
          lengthSpan.className = 'entry-length';
          lengthSpan.textContent = 'Length: --:--';

          const timesSpan = document.createElement('span');
          timesSpan.className = 'times';
          timesSpan.textContent = '';

          meta.appendChild(lengthSpan);
          meta.appendChild(timesSpan);
          li.appendChild(label);
          li.appendChild(meta);
          playlistList.appendChild(li);

          let duration = durationOverride !== undefined ? normalizeDuration(durationOverride) : null;
          if (duration !== null) {
            li.dataset.duration = duration;
            lengthSpan.textContent = `Length: ${formatTime(duration)}`;
          } else {
            li.dataset.duration = 0;
            if (hasDurationHelper) {
              const resolveDuration = window.mediaTools.getDuration(cleaned)
                .then(result => {
                  const normalized = normalizeDuration(result);
                  if (normalized !== null) {
                    li.dataset.duration = normalized;
                    lengthSpan.textContent = `Length: ${formatTime(normalized)}`;
                  }
                })
                .catch(err => {
                  console.warn('getDuration failed', err);
                })
                .finally(() => {
                  updateStartEndTimes();
                  if (!options.skipSave) {
                    saveSettings();
                  }
                });
              pendingUpdates.push(resolveDuration);
            }
          }
        }

        updateStartEndTimes();
        if (!options.skipSave) {
          saveSettings();
        }

        if (pendingUpdates.length) {
          try {
            await Promise.allSettled(pendingUpdates);
          } catch (err) {
            console.warn('duration update failed', err);
          }
        }
      }

      let dragSrcEl = null;

      function handleDragStart(e) {
        dragSrcEl = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      }

      function handleDragEnd() {
        this.classList.remove('dragging');
        playlistList.querySelectorAll('li').forEach(li => li.classList.remove('over'));
        updateStartEndTimes();
        saveSettings();
      }

      function handleDragOver(e) {
        e.preventDefault();
        return false;
      }

      function handleDragEnter() {
        this.classList.add('over');
      }

      function handleDragLeave() {
        this.classList.remove('over');
      }

      function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        if (dragSrcEl !== this) {
          const nodes = Array.from(playlistList.children);
          const srcIdx = nodes.indexOf(dragSrcEl);
          const tgtIdx = nodes.indexOf(this);
          if (srcIdx < tgtIdx) {
            playlistList.insertBefore(dragSrcEl, this.nextSibling);
          } else {
            playlistList.insertBefore(dragSrcEl, this);
          }
          updateStartEndTimes();
          saveSettings();
        }
        return false;
      }

      function attachDragHandlers(li) {
        if (!li || li.__dragHandlersAttached) {
          return;
        }
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragend', handleDragEnd);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('dragenter', handleDragEnter);
        li.addEventListener('dragleave', handleDragLeave);
        li.addEventListener('drop', handleDrop);
        li.addEventListener('dblclick', () => {
          li.remove();
          updateStartEndTimes();
          saveSettings();
        });
        li.__dragHandlersAttached = true;
      }

      const observer = new MutationObserver(mutations => {
        mutations.forEach(m => {
          m.addedNodes.forEach(node => {
            if (node.nodeName === 'LI') {
              attachDragHandlers(node);
            }
          });
        });
      });
      observer.observe(playlistList, { childList: true });

      function extractDropPaths(dataTransfer) {
        if (!dataTransfer) {
          return [];
        }

        const files = Array.from(dataTransfer.files || []);
        let paths = files.map(file => file.path || file.name).filter(Boolean);

        if (!paths.length) {
          const uriList = dataTransfer.getData('text/uri-list');
          if (uriList) {
            paths = uriList.split('\n')
              .map(line => line.trim())
              .filter(line => line && !line.startsWith('#'))
              .map(line => line.startsWith('file://') ? decodeURI(line.replace('file://', '')) : line);
          }
        }

        if (!paths.length) {
          const plain = dataTransfer.getData('text/plain');
          if (plain) {
            paths = plain.split('\n')
              .map(line => line.trim())
              .filter(Boolean);
          }
        }

        return paths;
      }

      function handleExternalDrop(e) {
        e.preventDefault();
        playlistList.classList.remove('dragover');
        const paths = extractDropPaths(e.dataTransfer);
        if (paths.length) {
          addToPlaylist(paths);
        }
      }

      playlistList.addEventListener('dragover', e => {
        e.preventDefault();
        playlistList.classList.add('dragover');
      });

      playlistList.addEventListener('dragleave', () => {
        playlistList.classList.remove('dragover');
      });

      playlistList.addEventListener('drop', e => {
        e.stopPropagation();
        handleExternalDrop(e);
      });

      window.addEventListener('dragover', e => {
        e.preventDefault();
      });

      window.addEventListener('drop', handleExternalDrop);

      function connect() {
        if (ws && ws.readyState === 1) {
          setConnStatus('Already connected', 'green');
          return;
        }
        const url = wsUrlInput.value;
        ws = new WebSocket(url);
        ws.onopen = () => setConnStatus('Connected', 'green');
        ws.onclose = () => setConnStatus('Disconnected', 'red');
        ws.onerror = () => setConnStatus('Error', 'red');
        ws.onmessage = event => {
          const msg = JSON.parse(event.data);
          if (msg.op === 5 && msg.d && msg.d.eventType === 'MediaInputPlaybackEnded') {
            const endedInput = msg.d.eventData.inputName;
            if (endedInput === mediaSource) playNext();
          }
        };
        ws.addEventListener('open', () => {
          ws.send(JSON.stringify({
            op: 1,
            d: { rpcVersion: 1, eventSubscriptions: (1 << 2) }
          }));
        });
      }

      function sendRequest(requestType, requestData, cb) {
        if (!ws || ws.readyState !== 1) {
          setStatus('Not connected to OBS WebSocket.');
          return;
        }
        const requestId = 'req-' + (requestCounter++);
        const msg = { op: 6, d: { requestType, requestId, requestData } };
        ws.send(JSON.stringify(msg));
        if (cb) {
          const handler = event => {
            const resp = JSON.parse(event.data);
            if (resp.op === 7 && resp.d.requestId === requestId) {
              ws.removeEventListener('message', handler);
              cb(resp.d);
            }
          };
          ws.addEventListener('message', handler);
        }
      }

      function playIndex(idx) {
        playlist = getPlaylist();
        mediaSource = getMediaSource();
        if (poller) clearInterval(poller);
        if (idx >= playlist.length) {
          setStatus('Done!');
          playing = false;
          return;
        }
        currentIndex = idx;
        const file = playlist[idx];
        setStatus(`Playing: ${file}`);
        sendRequest('SetInputSettings', {
          inputName: mediaSource,
          inputSettings: { local_file: file },
          overlay: false
        }, () => {
          setTimeout(() => {
            sendRequest('TriggerMediaInputAction', {
              inputName: mediaSource,
              mediaAction: 'restart'
            });
            startPolling();
          }, 200);
        });
      }

      function playNext() {
        if (poller) clearInterval(poller);
        playIndex(currentIndex + 1);
      }

      function startPolling() {
        if (poller) clearInterval(poller);
        poller = setInterval(() => {
          sendRequest('GetMediaInputStatus', {
            inputName: getMediaSource()
          }, data => {
            if (!data || !data.responseData) return;
            const s = data.responseData;
            if (s.mediaState === 'OBS_MEDIA_STATE_ENDED' || s.mediaState === 'OBS_MEDIA_STATE_STOPPED') {
              playNext();
            } else if (typeof s.mediaDuration === 'number' && typeof s.mediaCursor === 'number') {
              if (s.mediaDuration > 0 && (s.mediaDuration - s.mediaCursor) < 500) {
                playNext();
              }
            }
          });
        }, 500);
      }

      connectBtn.addEventListener('click', connect);

      playBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1) {
          setStatus('Not connected to OBS WebSocket.');
          return;
        }
        playlist = getPlaylist();
        if (!playlist.length) {
          setStatus('Playlist is empty.');
          return;
        }
        playing = true;
        playIndex(0);
      });

      streamBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1) {
          setStatus('Not connected to OBS WebSocket.');
          return;
        }
        sendRequest('StartStream', {}, () => {
          setStatus('Streaming started!');
        });
      });

      addFileBtn.addEventListener('click', async () => {
        let selected = [];

        if (window.mediaTools && typeof window.mediaTools.selectFiles === 'function') {
          try {
            selected = await window.mediaTools.selectFiles();
          } catch (err) {
            console.warn('selectFiles failed', err);
          }
        }

        if (selected && selected.length) {
          addToPlaylist(selected);
          return;
        }

        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const files = Array.from(fileInput.files || []);
        const paths = files.map(file => file.path || file.name).filter(Boolean);
        addToPlaylist(paths);
        fileInput.value = '';
      });

      scheduleBtn.addEventListener('click', () => {
        const dateStr = scheduleInput.value;
        if (!dateStr) {
          setStatus('Pick a date and time.');
          return;
        }
        const target = new Date(dateStr);
        const now = new Date();
        const ms = target.getTime() - now.getTime();
        if (ms <= 0) {
          setStatus('Scheduled time must be in the future.');
          return;
        }
        setStatus('Scheduled for ' + target.toLocaleString());
        if (scheduleTimeout) clearTimeout(scheduleTimeout);
        scheduleTimeout = setTimeout(() => {
          streamBtn.click();
          playBtn.click();
        }, ms);
        saveSettings();
      });

      wsUrlInput.addEventListener('input', saveSettings);
      mediaSourceInput.addEventListener('input', saveSettings);
      scheduleInput.addEventListener('input', saveSettings);

      async function loadSettings() {
        if (!window.mediaTools) return;
        try {
          const [wsUrl, storedMediaSource, playlistData, scheduleTime] = await Promise.all([
            window.mediaTools.loadData('wsUrl'),
            window.mediaTools.loadData('mediaSource'),
            window.mediaTools.loadData('playlist'),
            window.mediaTools.loadData('scheduleTime')
          ]);

          if (wsUrl) wsUrlInput.value = wsUrl;
          if (storedMediaSource) mediaSourceInput.value = storedMediaSource;

          if (Array.isArray(playlistData)) {
            playlistList.innerHTML = '';
            for (const item of playlistData) {
              await addToPlaylist([item.path], item.duration, { skipSave: true });
            }
          }

          if (scheduleTime) scheduleInput.value = scheduleTime;
        } catch (err) {
          console.warn('loadSettings failed', err);
        }
      }

      loadSettings();
    });
  </script>
</body>
</html>
