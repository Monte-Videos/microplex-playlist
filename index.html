<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBS Playlist POC</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #e6e8ed;
      color: #242633;
      height: 100vh;
    }
    #app {
      display: flex;
      height: 100%;
      width: 100%;
    }
    .sidebar {
      width: 220px;
      background: #f5f6fa;
      border-right: 1px solid #c9ccda;
      display: flex;
      flex-direction: column;
    }
    .sidebar header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #d7d9e4;
    }
    .sidebar header h2 {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
      color: #6b7083;
    }
    #newPlaylistBtn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: #dfe5f6;
      color: #2d4fba;
      font-size: 18px;
      line-height: 24px;
      cursor: pointer;
      padding: 0;
    }
    #newPlaylistBtn:hover { background: #d2dbf3; }
    #playlistSidebar {
      list-style: none;
      margin: 0;
      padding: 6px 0;
      flex: 1;
      overflow-y: auto;
    }
    #playlistSidebar li {
      padding: 6px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: #2f3240;
    }
    #playlistSidebar li:hover { background: #e9efff; }
    #playlistSidebar li.active {
      background: #dce6ff;
      font-weight: 600;
      color: #1f3065;
    }
    #playlistSidebar li .count {
      font-size: 11px;
      color: #6f7487;
      margin-left: 8px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 22px;
      gap: 16px;
      overflow: hidden;
    }
    .connection,
    .controls,
    .schedule {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .connection label,
    .media-source label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: #4b4e5c;
    }
    input[type="text"],
    input[type="datetime-local"] {
      border: 1px solid #c7cbd9;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      min-width: 180px;
      background: #fff;
      color: inherit;
    }
    button {
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button.primary { background: #2f69ff; color: #fff; }
    button.primary:hover { background: #1f56e5; }
    button.secondary { background: #eef1f8; color: #303448; }
    button.secondary:hover { background: #dfe4f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .media-source {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .playlist-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 8px;
    }
    .playlist-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #6f7487;
      flex-wrap: wrap;
      gap: 8px;
    }
    .playlist-toolbar .left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .playlist-table {
      border: 1px solid #c9ccda;
      border-radius: 6px;
      background: #fff;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .playlist-header {
      display: grid;
      grid-template-columns: 1fr 80px 80px 80px;
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7c8090;
      border-bottom: 1px solid #d7d9e4;
    }
    #playlistList {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1;
      overflow-y: auto;
    }
    #playlistList li {
      display: grid;
      grid-template-columns: 1fr 80px 80px 80px;
      align-items: center;
      padding: 4px 12px;
      font-size: 12px;
      border-bottom: 1px solid #eef1f7;
      cursor: default;
      user-select: none;
      background: #fff;
    }
    #playlistList li:last-child { border-bottom: none; }
    #playlistList li.dragging { opacity: 0.6; }
    #playlistList li.over { border-top: 2px solid #2f69ff; }
    #playlistList li .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #playlistList li .duration,
    #playlistList li .start,
    #playlistList li .end {
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding-left: 8px;
    }
    #playlistList li.playing {
      background: #e6f0ff;
      font-weight: 600;
    }
    #playlistList.dragover { background: #f0f6ff; }
    .remove-tip { font-size: 11px; color: #8b91a4; }
    #status { font-size: 12px; color: #2f3240; min-height: 18px; }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <header>
        <h2>Playlists</h2>
        <button id="newPlaylistBtn" title="New playlist">+</button>
      </header>
      <ul id="playlistSidebar"></ul>
    </aside>
    <main class="main">
      <section class="connection">
        <label>
          OBS WebSocket URL
          <input type="text" id="wsUrl" value="ws://the-microplex:4455">
        </label>
        <button id="connectBtn" class="primary">Connect</button>
        <span id="connStatus">Not connected</span>
      </section>
      <section class="media-source">
        <label>
          Media Source Name
          <input type="text" id="mediaSource" placeholder="OBS source name">
        </label>
      </section>
      <section class="playlist-section">
        <div class="playlist-toolbar">
          <div class="left">
            <button id="addFileBtn" class="secondary">Add File</button>
            <input type="file" id="fileInput" style="display:none;" multiple>
            <span class="remove-tip">Drag files in, drag to reorder, double-click a row to remove.</span>
          </div>
        </div>
        <div class="playlist-table">
          <div class="playlist-header">
            <div>Title</div>
            <div>Duration</div>
            <div>Start</div>
            <div>End</div>
          </div>
          <ul id="playlistList"></ul>
        </div>
      </section>
      <section class="controls">
        <button id="playBtn" class="primary">Play</button>
        <button id="streamBtn" class="secondary">Start Streaming</button>
      </section>
      <section class="schedule">
        <label>Schedule Start
          <input type="datetime-local" id="scheduleTime">
        </label>
        <button id="scheduleBtn" class="secondary">Schedule Start</button>
      </section>
      <div id="status"></div>
    </main>
  </div>

  <script>
    let ws = null;
    let playing = false;
    let isStreaming = false;
    let poller = null;
    let scheduleTimeout = null;
    let requestCounter = 1;
    let currentIndex = 0;
    let playingItemId = null;
    let isRestoring = false;
    let dragItemId = null;

    const playlists = [];
    let activePlaylistId = null;

    const playlistList = document.getElementById('playlistList');
    const playlistSidebar = document.getElementById('playlistSidebar');
    const mediaSourceInput = document.getElementById('mediaSource');
    const wsUrlInput = document.getElementById('wsUrl');
    const scheduleInput = document.getElementById('scheduleTime');

    function generateId(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function getActivePlaylist() {
      return playlists.find(pl => pl.id === activePlaylistId) || null;
    }

    function ensureDefaultPlaylist(name = 'Playlist 1') {
      if (!playlists.length) {
        playlists.push({
          id: generateId('pl'),
          name,
          mediaSource: name,
          items: []
        });
      }
      if (!activePlaylistId && playlists.length) {
        activePlaylistId = playlists[0].id;
      }
    }

    function normalizePath(rawPath) {
      if (!rawPath) return '';
      let cleaned = rawPath.trim().replace(/^['\"]+|['\"]+$/g, '');
      if (/^file:\/\//i.test(cleaned)) {
        try {
          const uri = new URL(cleaned);
          let pathname = decodeURIComponent(uri.pathname || '');
          if (/^\/[A-Za-z]:/.test(pathname)) {
            pathname = pathname.slice(1);
          }
          cleaned = pathname || '';
        } catch (err) {
          cleaned = cleaned.replace(/^file:\/\//i, '');
          cleaned = decodeURIComponent(cleaned);
          if (!cleaned.startsWith('/') && !/^[A-Za-z]:/.test(cleaned)) {
            cleaned = '/' + cleaned;
          }
        }
      }
      return cleaned;
    }

    function extractFilename(path) {
      if (!path) return '';
      const segments = path.split(/\\|\//);
      return segments[segments.length - 1] || path;
    }

    function formatTime(seconds) {
      if (seconds == null || isNaN(seconds) || seconds < 0) return '--:--';
      const total = Math.floor(seconds);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const minutes = String(m).padStart(2, '0');
      return (h > 0 ? `${h}:${minutes}` : `${minutes}`) + `:${String(s).padStart(2, '0')}`;
    }

    function getScheduleStartDate() {
      const value = scheduleInput.value;
      if (!value) return null;
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatClock(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '--:--';
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }

    function extractPathsFromDataTransfer(dt) {
      const results = new Set();
      if (dt && dt.files) {
        for (const file of Array.from(dt.files)) {
          if (file.path) {
            results.add(normalizePath(file.path));
          }
        }
      }
      if (dt && typeof dt.getData === 'function') {
        const uriList = dt.getData('text/uri-list');
        if (uriList) {
          uriList.split(/\r?\n/).forEach(line => {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) return;
            results.add(normalizePath(trimmed));
          });
        }
        const plain = dt.getData('text/plain');
        if (plain) {
          plain.split(/\r?\n/).forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            if (/^file:\/\//i.test(trimmed)) {
              results.add(normalizePath(trimmed));
            }
          });
        }
      }
      return Array.from(results).filter(Boolean);
    }

    function getMediaSource() {
      const active = getActivePlaylist();
      const inputValue = mediaSourceInput.value.trim();
      if (active) {
        const source = (active.mediaSource || '').trim();
        return source || inputValue || active.name || 'Media';
      }
      return inputValue || 'Media';
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg || '';
    }

    function setConnStatus(msg, color = 'black') {
      const el = document.getElementById('connStatus');
      el.textContent = msg;
      el.style.color = color;
    }
    function renderSidebar() {
      playlistSidebar.innerHTML = '';
      playlists.forEach(pl => {
        if (!pl.id) pl.id = generateId('pl');
        const li = document.createElement('li');
        li.dataset.id = pl.id;
        if (pl.id === activePlaylistId) li.classList.add('active');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = pl.name || 'Playlist';
        const countSpan = document.createElement('span');
        countSpan.className = 'count';
        countSpan.textContent = pl.items.length;
        li.append(nameSpan, countSpan);
        li.addEventListener('click', () => {
          if (activePlaylistId !== pl.id) {
            activatePlaylist(pl.id);
            recomputeCurrentIndex();
            updatePlayingIndicator();
            saveSettings();
          }
        });
        playlistSidebar.appendChild(li);
      });
    }

    function activatePlaylist(id) {
      if (!id) return;
      activePlaylistId = id;
      renderSidebar();
      renderActivePlaylist();
      const active = getActivePlaylist();
      mediaSourceInput.value = (active && active.mediaSource) ? active.mediaSource : (active ? active.name : '');
    }

    function createPlaylistRow(item) {
      const li = document.createElement('li');
      li.dataset.itemId = item.id;
      li.dataset.path = item.path;
      li.dataset.duration = item.duration != null ? item.duration : '';
      li.title = item.path;
      li.draggable = true;

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = extractFilename(item.path);

      const duration = document.createElement('span');
      duration.className = 'duration';
      duration.textContent = formatTime(item.duration);

      const start = document.createElement('span');
      start.className = 'start';
      start.textContent = '--:--';

      const end = document.createElement('span');
      end.className = 'end';
      end.textContent = '--:--';

      li.append(title, duration, start, end);
      attachRowHandlers(li);
      return li;
    }

    function renderActivePlaylist() {
      playlistList.innerHTML = '';
      const active = getActivePlaylist();
      if (!active) return;
      active.items = active.items.map(item => ({
        id: item.id || generateId('item'),
        path: normalizePath(item.path || ''),
        duration: Number.isFinite(item.duration) ? item.duration : null
      })).filter(item => item.path);
      active.items.forEach(item => {
        const row = createPlaylistRow(item);
        playlistList.appendChild(row);
      });
      updateStartEndTimes();
      updatePlayingIndicator();
    }

    function attachRowHandlers(li) {
      li.addEventListener('dragstart', function(e) {
        dragItemId = this.dataset.itemId;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      li.addEventListener('dragend', function() {
        this.classList.remove('dragging');
        Array.from(playlistList.children).forEach(node => node.classList.remove('over'));
        playlistList.classList.remove('dragover');
        dragItemId = null;
        updateStartEndTimes();
      });
      li.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      li.addEventListener('dragenter', function() {
        this.classList.add('over');
      });
      li.addEventListener('dragleave', function() {
        this.classList.remove('over');
      });
      li.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('over');
        playlistList.classList.remove('dragover');
        if (!dragItemId) return;
        const nodes = Array.from(playlistList.children);
        const srcNode = nodes.find(node => node.dataset.itemId === dragItemId);
        if (!srcNode || srcNode === this) return;
        const srcIdx = nodes.indexOf(srcNode);
        const tgtIdx = nodes.indexOf(this);
        if (srcIdx < tgtIdx) {
          playlistList.insertBefore(srcNode, this.nextSibling);
        } else {
          playlistList.insertBefore(srcNode, this);
        }
        syncActivePlaylistFromDom();
        recomputeCurrentIndex();
        updateStartEndTimes();
        updatePlayingIndicator();
        saveSettings();
        dragItemId = null;
      });
      li.addEventListener('dblclick', function() {
        removeItemById(this.dataset.itemId);
      });
    }

    function syncActivePlaylistFromDom() {
      const active = getActivePlaylist();
      if (!active) return;
      const existing = new Map(active.items.map(item => [item.id, item]));
      active.items = Array.from(playlistList.children).map(node => {
        const item = existing.get(node.dataset.itemId) || {};
        const durationAttr = node.dataset.duration;
        return {
          id: node.dataset.itemId,
          path: item.path || node.dataset.path,
          duration: durationAttr === '' ? (Number.isFinite(item.duration) ? item.duration : null) : Number(durationAttr)
        };
      });
    }

    function updateStartEndTimes() {
      const scheduleStart = getScheduleStartDate();
      let acc = 0;
      Array.from(playlistList.children).forEach(node => {
        const duration = Number(node.dataset.duration);
        const safeDuration = Number.isFinite(duration) && duration > 0 ? duration : 0;
        const startSeconds = acc;
        const endSeconds = acc + safeDuration;
        let startText = formatTime(startSeconds);
        let endText = formatTime(endSeconds);
        if (scheduleStart) {
          const startDate = new Date(scheduleStart.getTime() + startSeconds * 1000);
          const endDate = new Date(scheduleStart.getTime() + endSeconds * 1000);
          startText = formatClock(startDate);
          endText = formatClock(endDate);
        }
        const durationEl = node.querySelector('.duration');
        const startEl = node.querySelector('.start');
        const endEl = node.querySelector('.end');
        if (durationEl) durationEl.textContent = formatTime(safeDuration);
        if (startEl) startEl.textContent = startText;
        if (endEl) endEl.textContent = endText;
        acc += safeDuration;
      });
    }

    function updatePlayingIndicator() {
      Array.from(playlistList.children).forEach(node => {
        node.classList.toggle('playing', playing && node.dataset.itemId === playingItemId);
      });
    }

    function recomputeCurrentIndex() {
      if (!playing) {
        currentIndex = 0;
        return;
      }
      const active = getActivePlaylist();
      if (!active) {
        playing = false;
        playingItemId = null;
        currentIndex = 0;
        if (poller) clearInterval(poller);
        return;
      }
      const idx = active.items.findIndex(item => item.id === playingItemId);
      if (idx === -1) {
        playing = false;
        playingItemId = null;
        currentIndex = 0;
        if (poller) clearInterval(poller);
      } else {
        currentIndex = idx;
      }
    }

    function removeItemById(itemId) {
      const active = getActivePlaylist();
      if (!active) return;
      const index = active.items.findIndex(item => item.id === itemId);
      if (index === -1) return;
      const [removed] = active.items.splice(index, 1);
      if (playing && removed && removed.id === playingItemId) {
        playing = false;
        playingItemId = null;
        currentIndex = 0;
        if (poller) clearInterval(poller);
        setStatus('Playback stopped (item removed).');
      } else if (playing && index < currentIndex) {
        currentIndex = Math.max(0, currentIndex - 1);
      }
      renderActivePlaylist();
      saveSettings();
    }

    async function getFileDuration(path) {
      if (!window.mediaTools || typeof window.mediaTools.getDuration !== 'function') {
        return null;
      }
      try {
        const duration = await window.mediaTools.getDuration(path);
        return Number.isFinite(duration) ? duration : null;
      } catch (err) {
        console.warn('Failed to get duration for', path, err);
        return null;
      }
    }

    async function appendPathsToActivePlaylist(paths) {
      const active = getActivePlaylist();
      if (!active || !Array.isArray(paths) || !paths.length) return;
      const addedIds = new Set();
      for (const raw of paths) {
        const cleaned = normalizePath(raw);
        if (!cleaned) continue;
        const id = generateId('item');
        const item = {
          id,
          path: cleaned,
          duration: null
        };
        active.items.push(item);
        addedIds.add(id);
      }
      if (!addedIds.size) return;
      renderActivePlaylist();
      await saveSettings();
      const refreshed = getActivePlaylist();
      if (refreshed) {
        const itemsToPopulate = refreshed.items.filter(item => addedIds.has(item.id));
        if (itemsToPopulate.length) {
          populateDurationsForItems(itemsToPopulate).catch(err => {
            console.warn('Failed to populate durations', err);
          });
        }
      }
    }

    async function populateDurationsForItems(items) {
      if (!Array.isArray(items) || !items.length) return;
      let updatedData = false;
      let updatedDom = false;
      for (const item of items) {
        if (!item || item.duration != null) continue;
        const duration = await getFileDuration(item.path);
        if (!Number.isFinite(duration)) continue;
        item.duration = duration;
        updatedData = true;
        const node = playlistList.querySelector(`[data-item-id="${item.id}"]`);
        if (node) {
          node.dataset.duration = String(duration);
          const durationEl = node.querySelector('.duration');
          if (durationEl) {
            durationEl.textContent = formatTime(duration);
          }
          updatedDom = true;
        }
      }
      if (updatedDom) {
        updateStartEndTimes();
      }
      if (updatedData) {
        await saveSettings();
      }
    }

    async function refreshMissingDurations(playlist) {
      if (!playlist) return;
      const missing = playlist.items.filter(item => item.duration == null);
      if (!missing.length) return;
      await populateDurationsForItems(missing);
    }

    async function saveSettings() {
      if (isRestoring || !window.mediaTools || typeof window.mediaTools.saveData !== 'function') return;
      const serializedPlaylists = playlists.map(pl => ({
        id: pl.id,
        name: pl.name,
        mediaSource: pl.mediaSource || '',
        items: pl.items.map(item => ({
          id: item.id,
          path: item.path,
          duration: item.duration == null ? null : item.duration
        }))
      }));
      const active = getActivePlaylist();
      const tasks = [
        window.mediaTools.saveData('wsUrl', wsUrlInput.value),
        window.mediaTools.saveData('scheduleTime', scheduleInput.value),
        window.mediaTools.saveData('playlists', serializedPlaylists),
        window.mediaTools.saveData('activePlaylistId', activePlaylistId)
      ];
      if (active) {
        tasks.push(window.mediaTools.saveData('mediaSource', active.mediaSource || ''));
      }
      await Promise.allSettled(tasks);
    }
    async function loadSettings() {
      if (!window.mediaTools || typeof window.mediaTools.loadData !== 'function') {
        ensureDefaultPlaylist();
        activatePlaylist(activePlaylistId);
        updateStartEndTimes();
        return;
      }
      isRestoring = true;
      const [wsUrl, storedPlaylists, storedActiveId, scheduleTime, legacyMediaSource, legacyPlaylist] = await Promise.all([
        window.mediaTools.loadData('wsUrl'),
        window.mediaTools.loadData('playlists'),
        window.mediaTools.loadData('activePlaylistId'),
        window.mediaTools.loadData('scheduleTime'),
        window.mediaTools.loadData('mediaSource'),
        window.mediaTools.loadData('playlist')
      ]);
      if (wsUrl) wsUrlInput.value = wsUrl;
      if (scheduleTime) scheduleInput.value = scheduleTime;
      playlists.length = 0;
      let convertedLegacy = false;
      if (Array.isArray(storedPlaylists) && storedPlaylists.length) {
        storedPlaylists.forEach(pl => {
          const normalizedItems = Array.isArray(pl.items) ? pl.items.map(item => ({
            id: item.id || generateId('item'),
            path: normalizePath(item.path || ''),
            duration: Number.isFinite(item.duration) ? item.duration : null
          })).filter(item => item.path) : [];
          playlists.push({
            id: pl.id || generateId('pl'),
            name: pl.name || 'Playlist',
            mediaSource: pl.mediaSource || pl.name || legacyMediaSource || 'Media',
            items: normalizedItems
          });
        });
      }
      if (!playlists.length && Array.isArray(legacyPlaylist) && legacyPlaylist.length) {
        playlists.push({
          id: generateId('pl'),
          name: 'Playlist 1',
          mediaSource: legacyMediaSource || 'Playlist 1',
          items: legacyPlaylist.map(item => ({
            id: generateId('item'),
            path: normalizePath(item?.path || ''),
            duration: Number.isFinite(item?.duration) ? item.duration : null
          })).filter(item => item.path)
        });
        convertedLegacy = true;
      }
      ensureDefaultPlaylist();
      if (storedActiveId && playlists.some(pl => pl.id === storedActiveId)) {
        activePlaylistId = storedActiveId;
      }
      activatePlaylist(activePlaylistId);
      isRestoring = false;
      await refreshMissingDurations(getActivePlaylist());
      updateStartEndTimes();
      if (convertedLegacy) {
        await saveSettings();
      }
    }

    function updateStreamButton() {
      const btn = document.getElementById('streamBtn');
      if (!btn) return;
      btn.textContent = isStreaming ? 'Stop Streaming' : 'Start Streaming';
    }

    function refreshStreamState() {
      if (!ws || ws.readyState !== 1) return;
      sendRequest('GetStreamStatus', {}, data => {
        const active = !!(data && data.responseData && data.responseData.outputActive);
        isStreaming = active;
        updateStreamButton();
      });
    }

    function connect() {
      if (ws && ws.readyState === 1) {
        setConnStatus('Already connected', 'green');
        return;
      }
      const url = wsUrlInput.value;
      ws = new WebSocket(url);
      ws.onopen = () => {
        setConnStatus('Connected', 'green');
      };
      ws.onclose = () => {
        setConnStatus('Disconnected', 'red');
        isStreaming = false;
        updateStreamButton();
      };
      ws.onerror = () => setConnStatus('Error', 'red');
      ws.onmessage = event => {
        const msg = JSON.parse(event.data);
        if (msg.op === 5 && msg.d) {
          if (msg.d.eventType === 'MediaInputPlaybackEnded') {
            const endedInput = msg.d.eventData?.inputName;
            if (endedInput === getMediaSource()) {
              playNext();
            }
          } else if (msg.d.eventType === 'StreamStateChanged') {
            isStreaming = !!msg.d.eventData?.outputActive;
            updateStreamButton();
          }
        } else if (msg.op === 2) {
          refreshStreamState();
        }
      };
      ws.addEventListener('open', () => {
        ws.send(JSON.stringify({
          op: 1,
          d: { rpcVersion: 1, eventSubscriptions: ((1 << 2) | (1 << 3)) }
        }));
        refreshStreamState();
      });
    }

    function sendRequest(requestType, requestData, cb) {
      if (!ws || ws.readyState !== 1) {
        setStatus('Not connected to OBS WebSocket.');
        return;
      }
      const requestId = `req-${requestCounter++}`;
      const msg = { op: 6, d: { requestType, requestId, requestData } };
      ws.send(JSON.stringify(msg));
      if (cb) {
        const handler = event => {
          const resp = JSON.parse(event.data);
          if (resp.op === 7 && resp.d.requestId === requestId) {
            ws.removeEventListener('message', handler);
            cb(resp.d);
          }
        };
        ws.addEventListener('message', handler);
      }
    }

    function startPolling() {
      if (poller) clearInterval(poller);
      poller = setInterval(() => {
        sendRequest('GetMediaInputStatus', { inputName: getMediaSource() }, data => {
          if (!data || !data.responseData) return;
          const status = data.responseData;
          if (status.mediaState === 'OBS_MEDIA_STATE_ENDED' || status.mediaState === 'OBS_MEDIA_STATE_STOPPED') {
            playNext();
          } else if (typeof status.mediaDuration === 'number' && typeof status.mediaCursor === 'number') {
            if (status.mediaDuration > 0 && (status.mediaDuration - status.mediaCursor) < 500) {
              playNext();
            }
          }
        });
      }, 500);
    }

    function playIndex(idx) {
      const active = getActivePlaylist();
      if (!active) return;
      if (idx >= active.items.length) {
        playing = false;
        playingItemId = null;
        currentIndex = 0;
        if (poller) clearInterval(poller);
        setStatus('Done!');
        updatePlayingIndicator();
        return;
      }
      currentIndex = idx;
      const item = active.items[idx];
      playingItemId = item.id;
      const file = item.path;
      const mediaSourceName = getMediaSource();
      active.mediaSource = mediaSourceName;
      mediaSourceInput.value = mediaSourceName;
      saveSettings();
      setStatus(`Playing: ${file}`);
      sendRequest('SetInputSettings', {
        inputName: mediaSourceName,
        inputSettings: { local_file: file },
        overlay: false
      }, () => {
        setTimeout(() => {
          sendRequest('TriggerMediaInputAction', {
            inputName: mediaSourceName,
            mediaAction: 'restart'
          });
          startPolling();
          updatePlayingIndicator();
        }, 200);
      });
    }

    function playNext() {
      if (poller) clearInterval(poller);
      recomputeCurrentIndex();
      if (!playing) return;
      playIndex(currentIndex + 1);
    }

    document.getElementById('connectBtn').onclick = connect;

    document.getElementById('playBtn').onclick = () => {
      if (!ws || ws.readyState !== 1) {
        setStatus('Not connected to OBS WebSocket.');
        return;
      }
      const active = getActivePlaylist();
      if (!active || !active.items.length) {
        setStatus('Playlist is empty.');
        return;
      }
      playing = true;
      playIndex(0);
    };

    updateStreamButton();

    document.getElementById('streamBtn').onclick = () => {
      if (!ws || ws.readyState !== 1) {
        setStatus('Not connected to OBS WebSocket.');
        return;
      }
      const requestType = isStreaming ? 'StopStream' : 'StartStream';
      sendRequest(requestType, {}, data => {
        const succeeded = data?.requestStatus?.result === true;
        if (succeeded) {
          isStreaming = !isStreaming;
          updateStreamButton();
          setStatus(isStreaming ? 'Streaming started!' : 'Streaming stopped.');
        } else {
          setStatus('Failed to toggle streaming.');
        }
      });
    };
    document.getElementById('scheduleBtn').onclick = () => {
      const dateStr = scheduleInput.value;
      if (!dateStr) {
        setStatus('Pick a date and time.');
        return;
      }
      const target = new Date(dateStr);
      const now = new Date();
      const ms = target.getTime() - now.getTime();
      if (ms <= 0) {
        setStatus('Scheduled time must be in the future.');
        return;
      }
      setStatus(`Scheduled for ${target.toLocaleString()}`);
      if (scheduleTimeout) clearTimeout(scheduleTimeout);
      scheduleTimeout = setTimeout(() => {
        document.getElementById('streamBtn').click();
        document.getElementById('playBtn').click();
      }, ms);
      saveSettings();
    };

    document.getElementById('addFileBtn').onclick = async () => {
      if (window.mediaTools && typeof window.mediaTools.selectFiles === 'function') {
        const paths = await window.mediaTools.selectFiles();
        if (Array.isArray(paths) && paths.length) {
          await appendPathsToActivePlaylist(paths);
        }
      } else {
        const fileInput = document.getElementById('fileInput');
        fileInput.value = '';
        fileInput.click();
      }
    };

    document.getElementById('fileInput').onchange = async function() {
      const files = Array.from(this.files || []);
      const paths = files.map(file => file.path || file.name).filter(Boolean);
      if (paths.length) {
        await appendPathsToActivePlaylist(paths);
      }
    };

    window.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragItemId && e.dataTransfer) {
        e.dataTransfer.dropEffect = 'copy';
      }
    });

    window.addEventListener('drop', e => {
      e.preventDefault();
      playlistList.classList.remove('dragover');
      if (dragItemId) return;
      const paths = extractPathsFromDataTransfer(e.dataTransfer);
      if (paths.length) {
        appendPathsToActivePlaylist(paths).catch(err => {
          console.warn('Failed to add dropped files', err);
        });
      }
    });

    playlistList.addEventListener('dragover', e => {
      e.preventDefault();
      playlistList.classList.add('dragover');
    });
    playlistList.addEventListener('dragleave', () => {
      playlistList.classList.remove('dragover');
    });
    playlistList.addEventListener('drop', async e => {
      e.preventDefault();
      e.stopPropagation();
      playlistList.classList.remove('dragover');
      const paths = extractPathsFromDataTransfer(e.dataTransfer);
      if (paths.length) {
        await appendPathsToActivePlaylist(paths);
      }
    });

    document.getElementById('newPlaylistBtn').onclick = () => {
      const suggested = `Playlist ${playlists.length + 1}`;
      const name = window.prompt('Playlist name (matches VLC source)?', suggested);
      if (!name) return;
      const trimmed = name.trim();
      if (!trimmed) return;
      const newPlaylist = {
        id: generateId('pl'),
        name: trimmed,
        mediaSource: trimmed,
        items: []
      };
      playlists.push(newPlaylist);
      activatePlaylist(newPlaylist.id);
      saveSettings();
    };

    mediaSourceInput.addEventListener('input', () => {
      const active = getActivePlaylist();
      if (!active) return;
      active.mediaSource = mediaSourceInput.value.trim();
      saveSettings();
    });

    wsUrlInput.addEventListener('input', () => {
      saveSettings();
    });

    scheduleInput.addEventListener('input', () => {
      updateStartEndTimes();
      saveSettings();
    });

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', loadSettings);
    } else {
      loadSettings();
    }
  </script>
</body>
</html>
